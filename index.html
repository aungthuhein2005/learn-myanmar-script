<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 မြန်မာစာရေးနည်း</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5B8C5A;
      --primary-light: #8FBC8F;
      --accent: #E8A87C;
      --bg: #FFF8F0;
      --card-bg: #FFFFFF;
      --text: #3D3D3D;
      --text-light: #6B6B6B;
      --border: #E0D5C8;
      --success: #6B8E6B;
      --error: #C75B5B;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans Myanmar', 'Padauk', 'Myanmar Text', sans-serif;
      background: #f5f0eb;
      padding: 20px;
      min-height: 100vh;
    }

    .mw-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: var(--bg);
      border-radius: var(--radius);
      min-height: 600px;
    }

    .mw-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .mw-header h1 {
      font-size: 28px;
      color: var(--primary);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .mw-header p {
      color: var(--text-light);
      font-size: 15px;
    }

    .mw-model-error {
      margin: 12px auto 0;
      max-width: 620px;
      padding: 10px 14px;
      border: 1px solid var(--error);
      border-radius: 10px;
      background: #ffebee;
      color: var(--error);
      font-size: 14px;
    }

    .mw-nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .mw-nav-btn {
      padding: 10px 20px;
      border: 2px solid var(--border);
      border-radius: 24px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .mw-nav-btn:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
    }

    .mw-nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(91,140,90,0.3);
    }

    .mw-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .mw-section-title {
      font-size: 20px;
      color: var(--primary);
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mw-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 12px;
    }

    .mw-char-btn {
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Sans Myanmar', 'Padauk', sans-serif;
      color: var(--text);
      position: relative;
    }

    .mw-char-btn:hover {
      border-color: var(--primary);
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(91,140,90,0.2);
    }

    .mw-char-btn .char-label {
      position: absolute;
      bottom: 4px;
      font-size: 10px;
      color: var(--text-light);
      font-family: sans-serif;
    }

    .mw-char-btn .char-roman {
      position: absolute;
      top: 4px;
      font-size: 10px;
      color: var(--accent);
      font-weight: 600;
      font-family: sans-serif;
    }

    .mw-practice-area {
      text-align: center;
      padding: 32px 0;
    }

    .mw-target-char {
      font-size: 120px;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 8px;
      font-family: 'Noto Sans Myanmar', 'Padauk', sans-serif;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mw-target-roman {
      font-size: 20px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .mw-target-desc {
      font-size: 15px;
      color: var(--text-light);
      margin-bottom: 24px;
    }

    .mw-canvas-container {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .mw-canvas {
      border: 3px dashed var(--border);
      border-radius: 12px;
      background: #FFFCF8;
      cursor: crosshair;
      touch-action: none;
    }

    .mw-canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      opacity: 0.15;
      font-size: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: var(--primary);
      font-family: 'Noto Sans Myanmar', 'Padauk', sans-serif;
    }

    .mw-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .mw-btn {
      padding: 10px 24px;
      border-radius: 24px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .mw-btn-primary {
      background: var(--primary);
      color: white;
    }

    .mw-btn-primary:hover {
      background: #4a7549;
      transform: translateY(-2px);
    }

    .mw-btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--border);
    }

    .mw-btn-secondary:hover {
      border-color: var(--primary);
    }

    .mw-score {
      font-size: 18px;
      color: var(--success);
      font-weight: 700;
      margin-top: 12px;
    }

    .mw-progress {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .mw-progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s;
    }

    .mw-progress-dot.done {
      background: var(--success);
    }

    .mw-progress-dot.current {
      background: var(--accent);
      transform: scale(1.2);
    }

    .mw-hidden { display: none !important; }

    .mw-stars {
      font-size: 28px;
      color: #FFD700;
      margin-top: 8px;
    }

    .mw-trace-mode .mw-canvas-overlay {
      opacity: 0.25;
    }

    @media (max-width: 600px) {
      .mw-grid { grid-template-columns: repeat(5, 1fr); }
      .mw-target-char { font-size: 80px; min-height: 100px; }
      .mw-canvas { width: 280px !important; height: 280px !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
</head>
<body>
  <div class="mw-container" id="mwApp">
    <div class="mw-header">
      <h1>🎓 မြန်မာစာရေးနည်း</h1>
      <p>ကလေးတွေအတွက် မြန်မာစာလုံးရေးနည်းလေ့ကျင့်ရန်</p>
      <p id="modelError" class="mw-model-error mw-hidden" role="alert">Unable to load the handwriting recognition model. Please check your internet connection and try again.</p>
    </div>

    <div class="mw-nav">
      <button class="mw-nav-btn active" onclick="showTab('learn')">📚 သင်ခန်းစာ</button>
      <button class="mw-nav-btn" onclick="showTab('practice')">✏️ လေ့ကျင့်</button>
    </div>

    <!-- Learn Tab -->
    <div id="tab-learn" class="mw-tab">
      <div class="mw-card">
        <div class="mw-section-title">📖 ဗျည်းအက္ခရာများ (၃၃ လုံး)</div>
        <div class="mw-grid" id="consonantGrid"></div>
      </div>
      <div class="mw-card">
        <div class="mw-section-title">🎵 သရအက္ခရာများ</div>
        <div class="mw-grid" id="vowelGrid"></div>
      </div>
      <div class="mw-card">
        <div class="mw-section-title">🔢 ကိန်းဂဏန်းများ</div>
        <div class="mw-grid" id="numberGrid"></div>
      </div>
    </div>

    <!-- Practice Tab -->
    <div id="tab-practice" class="mw-tab mw-hidden">
      <div class="mw-card">
        <div class="mw-progress" id="practiceProgress"></div>
        <div class="mw-practice-area">
          <div class="mw-target-char" id="targetChar">က</div>
          <div class="mw-target-roman" id="targetRoman">ka</div>
          <div class="mw-target-desc" id="targetDesc">"က" ကို ရေးကြည့်ပါ</div>
          <div class="mw-canvas-container" id="canvasContainer">
            <canvas class="mw-canvas" id="practiceCanvas" width="320" height="320"></canvas>
            <div class="mw-canvas-overlay" id="canvasOverlay">က</div>
          </div>
          <div class="mw-controls">
            <button class="mw-btn mw-btn-secondary" onclick="toggleTrace()">👀 အရိပ်ကြည့်</button>
            <button class="mw-btn mw-btn-secondary" onclick="clearCanvas()">🗑️ ရှင်းလင်း</button>
            <button class="mw-btn mw-btn-primary" onclick="checkPractice()">✅ စစ်ဆေးရန်</button>
            <button class="mw-btn mw-btn-primary" onclick="nextPractice()">➡️ အသစ်</button>
          </div>
          <div class="mw-score" id="practiceScore"></div>
          <div class="mw-stars" id="practiceStars"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const consonants = [
      {char: 'က', roman: 'ka', group: 'ကအုပ်စု'},
      {char: 'ခ', roman: 'kha', group: 'ကအုပ်စု'},
      {char: 'ဂ', roman: 'ga', group: 'ကအုပ်စု'},
      {char: 'ဃ', roman: 'gha', group: 'ကအုပ်စု'},
      {char: 'င', roman: 'nga', group: 'ကအုပ်စု'},
      {char: 'စ', roman: 'sa', group: 'စအုပ်စု'},
      {char: 'ဆ', roman: 'sa', group: 'စအုပ်စု'},
      {char: 'ဇ', roman: 'za', group: 'စအုပ်စု'},
      {char: 'ဈ', roman: 'zha', group: 'စအုပ်စု'},
      {char: 'ည', roman: 'nya', group: 'စအုပ်စု'},
      {char: 'ဋ', roman: 'ta', group: 'ဋအုပ်စု'},
      {char: 'ဌ', roman: 'tha', group: 'ဋအုပ်စု'},
      {char: 'ဍ', roman: 'da', group: 'ဋအုပ်စု'},
      {char: 'ဎ', roman: 'dha', group: 'ဋအုပ်စု'},
      {char: 'ဏ', roman: 'na', group: 'ဋအုပ်စု'},
      {char: 'တ', roman: 'ta', group: 'တအုပ်စု'},
      {char: 'ထ', roman: 'tha', group: 'တအုပ်စု'},
      {char: 'ဒ', roman: 'da', group: 'တအုပ်စု'},
      {char: 'ဓ', roman: 'dha', group: 'တအုပ်စု'},
      {char: 'န', roman: 'na', group: 'တအုပ်စု'},
      {char: 'ပ', roman: 'pa', group: 'ပအုပ်စု'},
      {char: 'ဖ', roman: 'pha', group: 'ပအုပ်စု'},
      {char: 'ဗ', roman: 'ba', group: 'ပအုပ်စု'},
      {char: 'ဘ', roman: 'bha', group: 'ပအုပ်စု'},
      {char: 'မ', roman: 'ma', group: 'ပအုပ်စု'},
      {char: 'ယ', roman: 'ya', group: 'ယအုပ်စု'},
      {char: 'ရ', roman: 'ra', group: 'ယအုပ်စု'},
      {char: 'လ', roman: 'la', group: 'ယအုပ်စု'},
      {char: 'ဝ', roman: 'wa', group: 'ယအုပ်စု'},
      {char: 'သ', roman: 'tha', group: 'ယအုပ်စု'},
      {char: 'ဟ', roman: 'ha', group: 'အအုပ်စု'},
      {char: 'ဠ', roman: 'la', group: 'အအုပ်စု'},
      {char: 'အ', roman: 'a', group: 'အအုပ်စု'},
    ];

    const vowels = [
      {char: 'ာ', roman: 'aa', desc: 'အရ'},
      {char: 'ိ', roman: 'i', desc: 'အရ'},
      {char: 'ီ', roman: 'ii', desc: 'အရ'},
      {char: 'ု', roman: 'u', desc: 'အရ'},
      {char: 'ူ', roman: 'uu', desc: 'အရ'},
      {char: 'ေ', roman: 'e', desc: 'အရ'},
      {char: 'ဲ', roman: 'ai', desc: 'အရ'},
      {char: 'ော', roman: 'o', desc: 'အရ'},
      {char: 'ော်', roman: 'au', desc: 'အရ'},
      {char: '်', roman: 'virama', desc: 'အသံပြတ်'},
      {char: 'ံ', roman: 'an', desc: 'အသံမြင့်'},
      {char: 'း', roman: 'visarga', desc: 'အသံရဲ'},
      {char: '့', roman: 'dot', desc: 'အသံသွယ်'},
    ];

    const numbers = [
      {char: '၀', roman: '0'},
      {char: '၁', roman: '1'},
      {char: '၂', roman: '2'},
      {char: '၃', roman: '3'},
      {char: '၄', roman: '4'},
      {char: '၅', roman: '5'},
      {char: '၆', roman: '6'},
      {char: '၇', roman: '7'},
      {char: '၈', roman: '8'},
      {char: '၉', roman: '9'},
    ];

    const recordedChars = new Set(consonants.map(({ char }) => char));
    let activeCharacterAudio = null;

    let practiceIndex = 0;
    let practiceOrder = [];
    let isTracing = false;
    let canvas, ctx;
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    // === ONNX Model ===
    let modelSession = null;
    let modelReady = false;
    let embeddingCache = {};

    const MODEL_URL = 'https://huggingface.co/aungthuhein-dev/myanmar-handwriting/resolve/main/model.onnx';
    const MODEL_DATA_URL = 'https://huggingface.co/aungthuhein-dev/myanmar-handwriting/resolve/main/model.onnx.data';

    async function initModel() {
      const modelError = document.getElementById('modelError');
      if (typeof ort === 'undefined') {
        console.error('ONNX Runtime Web failed to load.');
        modelError.classList.remove('mw-hidden');
        return;
      }
      try {
        const [modelResp, dataResp] = await Promise.all([
          fetch(MODEL_URL),
          fetch(MODEL_DATA_URL),
        ]);
        if (!modelResp.ok) throw new Error(`Model request failed with HTTP ${modelResp.status}`);
        if (!dataResp.ok) throw new Error(`External model data request failed with HTTP ${dataResp.status}`);

        const modelBuf = await modelResp.arrayBuffer();
        const dataBuf = await dataResp.arrayBuffer();

        modelSession = await ort.InferenceSession.create(
          new Uint8Array(modelBuf),
          { externalData: [{ data: new Uint8Array(dataBuf), path: 'model.onnx.data' }] }
        );
        modelReady = true;
        modelError.classList.add('mw-hidden');
        console.log('Model loaded');
      } catch (e) {
        console.error('Model load failed:', e);
        modelError.classList.remove('mw-hidden');
      }
    }

    function preprocessImage(srcCanvas) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 224;
      tempCanvas.height = 224;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.fillStyle = '#FFFCF8';
      tempCtx.fillRect(0, 0, 224, 224);
      tempCtx.drawImage(srcCanvas, 0, 0, 224, 224);
      const imageData = tempCtx.getImageData(0, 0, 224, 224);
      const pixels = imageData.data;
      const size = 224 * 224;
      const input = new Float32Array(1 * 3 * size);
      for (let i = 0; i < size; i++) {
        const off = i * 4;
        input[i] = pixels[off] / 255;
        input[size + i] = pixels[off + 1] / 255;
        input[2 * size + i] = pixels[off + 2] / 255;
      }
      return input;
    }

    async function getEmbedding(srcCanvas) {
      if (!modelSession) return null;
      const input = preprocessImage(srcCanvas);
      const tensor = new ort.Tensor('float32', input, [1, 3, 224, 224]);
      const result = await modelSession.run({ input: tensor });
      return result.embeddings.data;
    }

    function cosineSimilarity(a, b) {
      let dot = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        na += a[i] * a[i];
        nb += b[i] * b[i];
      }
      return dot / (Math.sqrt(na) * Math.sqrt(nb));
    }

    async function getReferenceEmbedding(char) {
      if (embeddingCache[char]) return embeddingCache[char];
      const offscreen = document.createElement('canvas');
      offscreen.width = 320;
      offscreen.height = 320;
      const octx = offscreen.getContext('2d');
      octx.fillStyle = '#FFFCF8';
      octx.fillRect(0, 0, 320, 320);
      octx.fillStyle = '#3D3D3D';
      octx.font = '200px Noto Sans Myanmar, Padauk, sans-serif';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText(char, 160, 160);
      const emb = await getEmbedding(offscreen);
      embeddingCache[char] = emb;
      return emb;
    }

    function init() {
      renderConsonants();
      renderVowels();
      renderNumbers();
      initCanvas();
      initPractice();
      initModel();
    }

    function renderConsonants() {
      const grid = document.getElementById('consonantGrid');
      grid.innerHTML = consonants.map(c => `
        <div class="mw-char-btn" onclick="playChar('${c.char}', '${c.roman}')">
          <span class="char-roman">${c.roman}</span>
          ${c.char}
          <span class="char-label">${c.group}</span>
        </div>
      `).join('');
    }

    function renderVowels() {
      const grid = document.getElementById('vowelGrid');
      grid.innerHTML = vowels.map(v => `
        <div class="mw-char-btn" onclick="playChar('${v.char}', '${v.roman}')">
          <span class="char-roman">${v.roman}</span>
          ${v.char}
          <span class="char-label">${v.desc}</span>
        </div>
      `).join('');
    }

    function renderNumbers() {
      const grid = document.getElementById('numberGrid');
      grid.innerHTML = numbers.map(n => `
        <div class="mw-char-btn" onclick="playChar('${n.char}', '${n.roman}')">
          <span class="char-roman">${n.roman}</span>
          ${n.char}
        </div>
      `).join('');
    }

    function playChar(char, roman) {
      if (activeCharacterAudio) {
        activeCharacterAudio.pause();
        activeCharacterAudio.currentTime = 0;
        activeCharacterAudio = null;
      }

      if (recordedChars.has(char)) {
        const audio = new Audio(`voices/${encodeURIComponent(char)}.m4a`);
        activeCharacterAudio = audio;
        let fallbackStarted = false;

        const useSpeechSynthesis = () => {
          if (fallbackStarted) return;
          fallbackStarted = true;
          activeCharacterAudio = null;
          speakWithBrowser(char);
        };

        audio.addEventListener('ended', () => {
          if (activeCharacterAudio === audio) activeCharacterAudio = null;
        }, { once: true });
        audio.addEventListener('error', useSpeechSynthesis, { once: true });
        audio.play().catch(useSpeechSynthesis);
        return;
      }

      speakWithBrowser(char);
    }

    function speakWithBrowser(char) {
      const utterance = new SpeechSynthesisUtterance(char);
      utterance.lang = 'my-MM';
      utterance.rate = 0.8;
      speechSynthesis.speak(utterance);
    }

    function showTab(tab) {
      document.querySelectorAll('.mw-tab').forEach(t => t.classList.add('mw-hidden'));
      document.getElementById('tab-' + tab).classList.remove('mw-hidden');
      document.querySelectorAll('.mw-nav-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (tab === 'practice') initPractice();
    }

    function initCanvas() {
      canvas = document.getElementById('practiceCanvas');
      ctx = canvas.getContext('2d');
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#3D3D3D';

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseout', stopDraw);

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        startDraw({offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top});
      });
      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        draw({offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top});
      });
      canvas.addEventListener('touchend', stopDraw);
    }

    function startDraw(e) {
      isDrawing = true;
      lastX = e.offsetX;
      lastY = e.offsetY;
    }

    function draw(e) {
      if (!isDrawing) return;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      lastX = e.offsetX;
      lastY = e.offsetY;
    }

    function stopDraw() {
      isDrawing = false;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('practiceScore').textContent = '';
      document.getElementById('practiceStars').textContent = '';
    }

    function toggleTrace() {
      isTracing = !isTracing;
      document.getElementById('canvasContainer').classList.toggle('mw-trace-mode', isTracing);
    }

    function initPractice() {
      practiceOrder = [...consonants].sort(() => Math.random() - 0.5);
      practiceIndex = 0;
      loadPracticeChar();
    }

    function loadPracticeChar() {
      const c = practiceOrder[practiceIndex];
      document.getElementById('targetChar').textContent = c.char;
      document.getElementById('targetRoman').textContent = c.roman;
      document.getElementById('targetDesc').textContent = `"${c.char}" (${c.roman}) ကို ရေးကြည့်ပါ`;
      document.getElementById('canvasOverlay').textContent = c.char;
      clearCanvas();
      renderPracticeProgress();
      playChar(c.char, c.roman);
      if (modelReady) {
        getReferenceEmbedding(c.char);
      }
    }

    function renderPracticeProgress() {
      const dots = practiceOrder.map((_, i) => {
        let cls = 'mw-progress-dot';
        if (i < practiceIndex) cls += ' done';
        else if (i === practiceIndex) cls += ' current';
        return `<div class="${cls}"></div>`;
      }).join('');
      document.getElementById('practiceProgress').innerHTML = dots;
    }

    async function checkPractice() {
      const c = practiceOrder[practiceIndex];
      const scoreEl = document.getElementById('practiceScore');
      const starsEl = document.getElementById('practiceStars');

      if (!modelReady) {
        scoreEl.textContent = '⏳ မော်ဒယ်တင်နေသည်...';
        starsEl.textContent = '';
        return;
      }

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let drawnPixels = 0;
      for (let i = 3; i < imageData.data.length; i += 4) {
        if (imageData.data[i] > 0) drawnPixels++;
      }
      if (drawnPixels < 10) {
        scoreEl.textContent = '✏️ ဦးစွာရေးဆွဲပါ';
        starsEl.textContent = '';
        return;
      }

      scoreEl.textContent = '⏳ စစ်ဆေးနေသည်...';
      starsEl.textContent = '';

      const refEmb = await getReferenceEmbedding(c.char);
      const userEmb = await getEmbedding(canvas);

      if (!refEmb || !userEmb) {
        scoreEl.textContent = '❌ မော်ဒယ်အမှား';
        return;
      }

      const sim = cosineSimilarity(refEmb, userEmb);
      console.log('Similarity with', c.char, ':', sim.toFixed(4));

      if (sim > 0.55) {
        scoreEl.textContent = '👏 သိပ်ကောင်းတယ်!';
        starsEl.textContent = '⭐⭐⭐';
        playChar('ကောင်းတယ်', 'good');
      } else if (sim > 0.3) {
        scoreEl.textContent = '✏️ နီးစပ်တယ်၊ ထပ်ကြိုးစားပါ';
        starsEl.textContent = '⭐';
      } else {
        scoreEl.textContent = '✏️ ထပ်ရေးကြည့်ပါ';
        starsEl.textContent = '';
      }
    }

    function nextPractice() {
      practiceIndex = (practiceIndex + 1) % practiceOrder.length;
      loadPracticeChar();
    }

    init();
  </script>
</body>
</html>
